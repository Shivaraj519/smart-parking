{% extends 'base.html' %}
{% block title %}Create Driver Account - ParkSmart 2.0{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="custom-card p-4 p-md-5" style="border-top: 5px solid var(--accent-orange);">
        <div class="text-center mb-4">
          <span class="card-label text-warning d-block mb-1">NEW CUSTOMER REGISTRATION</span>
          <h3 class="serif-heading mb-1">Create Driver Account</h3>
          <p class="text-muted mb-0" style="font-size:0.88rem;">Join ParkSmart to instantly reserve parking bays across partner malls</p>
        </div>

        <form method="POST" action="{{ url_for('register') }}">
          <div class="mb-3">
            <label class="card-label">FULL NAME</label>
            <input type="text" name="full_name" class="form-control" placeholder="e.g. Ramesh Kumar" required value="{{ request.form.get('full_name', '') }}">
          </div>

          <div class="row g-2 mb-3">
            <div class="col-md-6">
              <label class="card-label">EMAIL ADDRESS</label>
              <input type="email" name="email" class="form-control" placeholder="ramesh@example.com" required value="{{ request.form.get('email', '') }}">
            </div>
            <div class="col-md-6">
              <label class="card-label">PHONE NUMBER</label>
              <input type="tel" name="phone_number" class="form-control" placeholder="9876543210" required value="{{ request.form.get('phone_number', '') }}">
            </div>
          </div>

          <div class="row g-2 mb-3">
            <div class="col-md-6">
              <label class="card-label">DRIVING LICENSE NUMBER</label>
              <input type="text" name="license_number" class="form-control" placeholder="KA01-20230009876" required value="{{ request.form.get('license_number', '') }}">
            </div>
            <div class="col-md-6">
              <label class="card-label">INITIAL WALLET BALANCE (₹)</label>
              <input type="number" name="wallet_balance" class="form-control" value="500.00" min="0" step="10">
            </div>
          </div>

          <div class="mb-4">
            <label class="card-label">PASSWORD</label>
            <input type="password" name="password" class="form-control" placeholder="••••••••" required>
          </div>

          <button type="submit" class="btn-orange w-100 justify-content-center py-2 mb-3">
            Register & Fund Wallet &rarr;
          </button>
        </form>

        <div class="text-center pt-3 border-top mt-2" style="font-size: 0.88rem;">
          <span class="text-muted">Already registered?</span>
          <a href="{{ url_for('login') }}" class="text-decoration-none fw-semibold" style="color: var(--accent-terracotta);">Sign in here</a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
